en:
  js:
    fingerprint:
      title: 'Fingerprint'

      latest_matches: 'Latest Matched Fingerprints'
      latest_matches_instructions: |
        <p><small>User devices will be fingerprinted once per session using {{algorithm}}. For more information about fingerprinting algorithms and provide feedback, please go to <a href="https://meta.discourse.org/t/discourse-fingerprint-browser-fingerprinting-plugin/114890">this topic on Discourse Meta</a>.</small></p>
      hide_common: 'Hide common'

      flagged: 'Hidden, Silenced or Suspended Fingerprints'
      flagged_instructions: |
        <p>
        A <i>hidden fingerprint</i> will not be shown in the <i>Latest Matched Fingerprints</i> section.
        A <i>silenced fingerprint</i> will cause all users with the given fingerprint to be silenced next time they visit.
        A <i>suspended fingerprint</i> will cause all users with the given fingerprint or cookie to be suspended indefinitely and logged out when they next report their fingerprint. Suspension takes precedence over silencing.
        Removing a suspension rule stops future automatic suspensions; already suspended accounts must be unsuspended individually in user administration.
        </p>

        <p>
        Silencing or suspending a fingerprint should be used only as a last resort as it is not guaranteed that it always matches the same user.
        For example, users with similar configuration and hardware (devices of same make and model) have a high chance of having matching fingerprints.
        </p>
      flagged_not_found: 'No fingerprints were hidden, silenced or suspended.'

      matches_for: 'Matches for'
      matches_found:
        one: '{{count}} user has matching fingerprints.'
        other: '{{count}} users have matching fingerprints.'
      matches_not_found: 'No similar signature were found.'
      none: 'This user has no recorded fingerprints.'

      common_device: 'This fingerprints looks like it is coming from a common device. The report may not be relevant.'
      hide: 'Hide'
      unhide: 'Unhide'
      silence: 'Silence'
      unsilence: 'Unsilence'
      suspend: 'Suspend'
      unsuspend: 'Remove suspension rule'
      suspend_confirm: 'All accounts matching this fingerprint or cookie will be suspended indefinitely and logged out when they next report their fingerprint. Shared devices can cause unrelated accounts to match. Removing this rule will not unsuspend accounts already affected. Enable this suspension rule?'
      ignore: 'Ignore'
      unignore: 'Unignore'
      details: 'Details'

      results:
        matching_user: 'Matching User'
        hash: 'Algorithm and Hash'
        first_seen: 'First Seen'
        last_seen: 'Last Seen'
        matches: 'Matches'
